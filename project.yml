name: Driftglass
options:
  bundleIdPrefix: com.shaazkhan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: GRFA8BR7C4
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Driftglass:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Driftglass
        NSLocalNetworkUsageDescription: Driftglass finds your Mac on your Wi‑Fi so you can see and control it.
        NSBonjourServices: [_driftglass._tcp]
        UIAppFonts: [InstrumentSerif-Italic.ttf]
        UILaunchScreen: {UIColorName: ""}
        UIApplicationSceneManifest: {UIApplicationSupportsMultipleScenes: false}
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaazkhan.driftglass
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  DriftglassMac:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    info:
      path: Mac/Info.plist
      properties:
        CFBundleName: Driftglass
        CFBundleDisplayName: Driftglass
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Driftglass lets your iPhone find this Mac on your Wi‑Fi.
        NSBonjourServices: [_driftglass._tcp]
    settings:
      base:
        PRODUCT_NAME: Driftglass
        PRODUCT_BUNDLE_IDENTIFIER: com.shaazkhan.driftglass.mac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
